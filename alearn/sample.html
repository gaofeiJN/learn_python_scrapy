            <h2><span style="width:72px">译文与注释</span></h2>
            <a rel="nofollow" href="/xiefanyi_1.html"><img width="11" height="11" alt="写翻译"
                    src="https://static.guwenxue.org/images/fanyi.gif"> 写翻译</a>
        </div>

        <div class="son5 content">
            <p><strong>直译</strong><br>明亮的月光洒在床前的窗户纸上，好像地上泛起了一层霜。<br>我禁不住抬起头来，看那天窗外空中的一轮明月，不由得低头沉思，想起远方的家乡。<br><strong>韵译</strong><br>皎洁月光洒满床，恰似朦胧一片霜。<br>仰首只见月一轮，低头教人倍思乡。
            </p>
            <p><strong>注释</strong><br>⑴静夜思：静静的夜里，产生的思绪
                。<br>⑵床：今传五种说法。<br>一指井台。已经有学者撰文考证过。中国教育家协会理事程实将考证结果写成论文发表在刊物上，还和好友创作了《诗意图》。<br>二指井栏。从考古发现来看，中国最早的水井是木结构水井。古代井栏有数米高，成方框形围住井口，防止人跌入井内，这方框形既像四堵墙，又像古代的床。因此古代井栏又叫银床，说明井和床有关系，其关系的发生则是由于两者在形状上的相似和功能上的类同。古代井栏专门有一个字来指称，即“韩”字。《说文》释“韩”为“井垣也”，即井墙之意。<br>三“床”即“窗”的通假字。本诗中的‘床’字，是争论和异议的焦点。我们可以做一下基本推理。本诗的写作背景是在一个明月夜，很可能是月圆前后，作者由看到月光，再看到明月，又引起思乡之情。
                <br>既然作者抬头看到了明月，那么作者不可能身处室内，在室内随便一抬头，是看不到月亮的。因此我们断定，‘床’是室外的一件物什，至于具体是什么，很难考证。从意义上讲，‘床’可能与‘窗’通假，而且在窗户前面是可能看到月亮的。但是，参照宋代版本，‘举头望山月’，便可证实作者所言乃是室外的月亮。从时间上讲，宋代版本比明代版本在对作者原意的忠诚度上，更加可靠。
                <br>四取本义，即坐卧的器具，《诗经·小雅·斯干》有“载寐之牀”，《易·剥牀·王犊注》亦有“在下而安者也。”之说，讲得即是卧具。<br>五马未都等认为，床应解释为胡床。胡床，亦称“交床”、“交椅”、“绳床”。古时一种可以折叠的轻便坐具，马扎功能类似小板凳，但人所坐的面非木板，而是可卷折的布或类似物，两边腿可合起来。现代人常为古代文献中或诗词中的“胡床”或“床”所误。至迟在唐时，“床”仍然是“胡床”（即马扎，一种坐具）。<br>⑶疑：好像。
                <br>⑷举头：抬头。</p>
